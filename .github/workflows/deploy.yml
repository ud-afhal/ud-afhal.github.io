name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同時に複数回デプロイしない(後から来た実行は待つ)。
concurrency:
  group: pages
  cancel-in-progress: false

# リポジトリの読み取りだけを許可する。
# Pagesへの公開権限はdeployジョブにだけ与える。
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # TXTから資料一覧とHTMLを生成する。リポジトリには書き戻さない。
      - name: Build _site
        run: node scripts/compile.js

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
